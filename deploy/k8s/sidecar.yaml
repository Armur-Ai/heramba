# Heramba as a sidecar in front of your app pod.
#
# The Service sends ingress traffic to Heramba (:8080), which reverse-proxies to
# your app container on localhost inside the same pod. Observe mode is safe in
# production. Apply with:
#
#     kubectl apply -f deploy/k8s/sidecar.yaml
#
# Flip HERAMBA_MODE to "protect" to go inline once trusted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  labels: { app: myapp }
spec:
  replicas: 2
  selector:
    matchLabels: { app: myapp }
  template:
    metadata:
      labels: { app: myapp }
    spec:
      containers:
        # --- your application (listens on localhost:3000) ---
        - name: app
          image: your-registry/your-app:latest
          ports:
            - containerPort: 3000

        # --- Heramba edge sidecar (public entrypoint) ---
        - name: heramba
          image: ghcr.io/armur-ai/heramba:latest
          args: ["serve"]
          env:
            - name: HERAMBA_UPSTREAM
              value: "http://127.0.0.1:3000"
            - name: HERAMBA_MODE
              value: "observe" # observe (safe) | protect (inline)
            - name: HERAMBA_ADMIN_LISTEN
              value: ":9090" # health + Prometheus /metrics
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9090
          livenessProbe:
            httpGet: { path: /healthz, port: admin }
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: admin }
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: myapp
spec:
  selector: { app: myapp }
  ports:
    - name: http
      port: 80
      targetPort: 8080 # ingress -> Heramba, not the app directly
