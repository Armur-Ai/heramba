<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-label="Heramba four-plane architecture: data plane feeds the intelligence plane, which drives the adaptive-defense plane, all exercised by the research plane">
  <defs>
    <linearGradient id="fpbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1119"/><stop offset="1" stop-color="#0e1722"/></linearGradient>
    <marker id="fpa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3ddc97"/></marker>
    <style>
      .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#dce7ee;font-weight:700}
      .s{font-family:'SFMono-Regular',Consolas,monospace;fill:#8aa0ad;font-size:12px}
      .pkg{font-family:'SFMono-Regular',Consolas,monospace;fill:#aebecb;font-size:11px}
      .plane{fill:#111c28;stroke:#27384a;stroke-width:1.5}
      .chip{fill:#16222f;stroke:#2a3c4f;stroke-width:1}
      .acc{fill:#3ddc97}
      .f{stroke:#3ddc97;stroke-width:2.5;fill:none}
    </style>
  </defs>
  <rect width="1080" height="560" fill="url(#fpbg)"/>
  <text class="t" x="40" y="44" font-size="23">Heramba — four-plane architecture</text>
  <text class="s" x="40" y="68">Each plane is modular packages inside one binary — not microservices. Detections flow up into intelligence, intelligence drives bounded defense.</text>

  <!-- DATA PLANE -->
  <rect class="plane" x="40" y="92" width="1000" height="96" rx="12"/>
  <circle class="acc" cx="66" cy="118" r="6"/>
  <text class="t" x="82" y="123" font-size="15">Data plane</text>
  <text class="s" x="82" y="142">reverse-proxy edge · classify · decoys/canaries · signal denial · egress firewall · rate limit · counter-agent</text>
  <g font-size="11">
    <rect class="chip" x="82" y="152" width="120" height="24" rx="5"/><text class="pkg" x="92" y="168">internal/edge</text>
    <rect class="chip" x="212" y="152" width="120" height="24" rx="5"/><text class="pkg" x="222" y="168">internal/classify</text>
    <rect class="chip" x="342" y="152" width="110" height="24" rx="5"/><text class="pkg" x="352" y="168">internal/decoy</text>
    <rect class="chip" x="462" y="152" width="115" height="24" rx="5"/><text class="pkg" x="472" y="168">internal/signal</text>
    <rect class="chip" x="587" y="152" width="115" height="24" rx="5"/><text class="pkg" x="597" y="168">internal/egress</text>
    <rect class="chip" x="712" y="152" width="120" height="24" rx="5"/><text class="pkg" x="722" y="168">internal/counter</text>
    <rect class="chip" x="842" y="152" width="110" height="24" rx="5"/><text class="pkg" x="852" y="168">internal/alert</text>
  </g>

  <!-- INTELLIGENCE PLANE -->
  <rect class="plane" x="40" y="214" width="1000" height="96" rx="12"/>
  <circle fill="#5b93ff" cx="66" cy="240" r="6"/>
  <text class="t" x="82" y="245" font-size="15">Intelligence plane</text>
  <text class="s" x="82" y="264">normalized evidence (observed vs inferred) · campaign reconstruction · swarm coordination · multi-sensor · active learning</text>
  <g font-size="11">
    <rect class="chip" x="82" y="274" width="135" height="24" rx="5"/><text class="pkg" x="92" y="290">internal/evidence</text>
    <rect class="chip" x="227" y="274" width="140" height="24" rx="5"/><text class="pkg" x="237" y="290">internal/campaign</text>
    <rect class="chip" x="377" y="274" width="150" height="24" rx="5"/><text class="pkg" x="387" y="290">campaign/swarm</text>
    <rect class="chip" x="537" y="274" width="170" height="24" rx="5"/><text class="pkg" x="547" y="290">campaign/experiment</text>
    <rect class="chip" x="717" y="274" width="150" height="24" rx="5"/><text class="pkg" x="727" y="290">evidence/sensor</text>
    <rect class="chip" x="877" y="274" width="120" height="24" rx="5"/><text class="pkg" x="887" y="290">internal/intel</text>
  </g>

  <!-- ADAPTIVE DEFENSE PLANE -->
  <rect class="plane" x="40" y="336" width="1000" height="96" rx="12"/>
  <circle fill="#f5b35a" cx="66" cy="362" r="6"/>
  <text class="t" x="82" y="367" font-size="15">Adaptive-defense plane</text>
  <text class="s" x="82" y="386">typed bounded actions · deterministic policy (injection-proof) · shadow default · approval/expiry/rollback · stateful deception · real/synthetic graphs</text>
  <g font-size="11">
    <rect class="chip" x="82" y="396" width="140" height="24" rx="5"/><text class="pkg" x="92" y="412">internal/strategy</text>
    <rect class="chip" x="232" y="396" width="150" height="24" rx="5"/><text class="pkg" x="242" y="412">internal/deception</text>
    <rect class="chip" x="392" y="396" width="150" height="24" rx="5"/><text class="pkg" x="402" y="412">internal/assetgraph</text>
    <rect class="chip" x="552" y="396" width="140" height="24" rx="5"/><text class="pkg" x="562" y="412">internal/bizlogic</text>
  </g>

  <!-- RESEARCH PLANE -->
  <rect class="plane" x="40" y="458" width="1000" height="78" rx="12"/>
  <circle fill="#ff5d6e" cx="66" cy="484" r="6"/>
  <text class="t" x="82" y="489" font-size="15">Research plane</text>
  <text class="s" x="82" y="508">seeded deterministic scenarios · four-baseline evaluation · measured metrics + uncertainty · six locally-gradable labs</text>
  <g font-size="11">
    <rect class="chip" x="82" y="512" width="135" height="20" rx="5"/><text class="pkg" x="92" y="526">internal/replay</text>
    <rect class="chip" x="227" y="512" width="90" height="20" rx="5"/><text class="pkg" x="237" y="526">labs/</text>
    <rect class="chip" x="327" y="512" width="230" height="20" rx="5"/><text class="pkg" x="337" y="526">cmd: heramba experiment</text>
  </g>

  <!-- flow arrows up the right gutter -->
  <path class="f" d="M1020 188 V214" marker-end="url(#fpa)"/>
  <path class="f" d="M1020 310 V336" marker-end="url(#fpa)"/>
  <path class="f" d="M20 432 V214" marker-end="url(#fpa)" opacity="0.5"/>
</svg>
