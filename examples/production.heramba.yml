# Example: a production-leaning Heramba deployment.
#
# Annotated reverse-proxy config in PROTECT mode behind a load balancer, with a
# durable local audit trail and a Slack notification channel. Every key here is
# a real field from internal/config — lint before you ship it:
#
#   heramba config lint examples/production.heramba.yml

mode: protect                      # inline action; requires an upstream (below)
listen: ":8080"                    # bind all interfaces behind the LB
upstream: "http://127.0.0.1:3000"  # your real app

# admin_listen serves /healthz, /readyz, Prometheus /metrics, and the admin
# dashboard. Keep it off the public interface (scrape it from inside the mesh).
admin_listen: "127.0.0.1:9090"

# Only trust X-Forwarded-For from your own load balancer's CIDRs, so the real
# client IP can't be spoofed. Empty = always use the direct peer address.
trusted_proxies:
  - "10.0.0.0/8"

# PROTECT-mode throttling: cap each source's request rate (0 = disabled; never
# engaged in observe mode). Burst defaults to max(rate_limit_rps, 1).
rate_limit_rps: 20
rate_limit_burst: 40

# Graceful drain on shutdown: readiness flips to not-ready, then the edge waits
# this many seconds so the LB deregisters it before in-flight traffic is cut.
drain_timeout: 15

alert:
  # The local text/jsonl record always captures everything.
  format: jsonl
  file: "/var/log/heramba/events.jsonl"

  # Push sinks honor min_severity so a busy edge doesn't flood a channel.
  min_severity: high
  slack: "https://hooks.slack.com/services/T000/B000/XXXXXXXX"

  # A durable, bounded, local-only JSONL audit trail (ignores min_severity).
  rotate:
    file: "/var/log/heramba/audit.jsonl"
    max_bytes: 10485760            # rotate at 10 MiB
    max_backups: 5                 # keep 5 rotated files

decoys:
  enabled: true
  preset: express                  # framework decoy surface (heramba decoys presets)
  paths:
    - /internal/debug              # extra decoy paths to serve and watch
  canaries:
    - hrmb_3a0ea0333739e3ff693757cd84aae412  # planted token; any use = intrusion

# Counter-agent prompt-decoy injection for classifier-flagged agentic sources
# (PROTECT mode). Off by default.
counter:
  enabled: true

# Callback firewall: deny app egress except to these hosts (PROTECT mode).
egress:
  enabled: true
  allowed_hosts:
    - api.stripe.com
    - api.github.com

# TLS: static certificate HTTPS for the edge listener. Leave both empty to
# terminate TLS at the load balancer instead (both must be set, or both empty).
tls:
  cert_file: ""
  key_file: ""
